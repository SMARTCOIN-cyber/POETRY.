
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>POETRY</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, Helvetica, sans-serif;
            background: #111;
            color: white;
        }

        h1 {
            text-align: center;
            margin: 10px 0 30px;
            font-size: 32px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            align-items: start;
        }

        .gallery img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            background: #222;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            h1 {
                font-size: 25px;
                margin-bottom: 20px;
            }

            .gallery {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .gallery img {
                border-radius: 10px;
            }
        }
    </style>

</head>

<body>

    <h1>POETRY</h1>

    <div class="gallery" id="gallery"></div>

    <script>
        const gallery = document.getElementById("gallery");

        // Automatically display all 132 pictures
        for (let i = 1; i <= 114; i++) {

            const img = document.createElement("img");

            img.src = `photo${i}.jpg`;
            img.alt = `Photo ${i}`;
            img.loading = "lazy";

            gallery.appendChild(img);
        }
    </script>

</body>
</html>
