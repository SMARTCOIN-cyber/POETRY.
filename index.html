
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>POETRY</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, Helvetica, sans-serif;
            background: #111;
            color: white;
        }

        h1 {
            text-align: center;
            margin: 10px 0 30px;
            font-size: 32px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            align-items: start;
        }

        .gallery img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            background: #222;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }

        /* Mobile phones */
        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            h1 {
                font-size: 25px;
                margin-bottom: 20px;
            }

            .gallery {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .gallery img {
                border-radius: 10px;
            }
        }
    </style>
</head>

<body>

    <h1>POETRY</h1>

    <div class="gallery">

        <img src="photo1.jpg" alt="Photo 1">
        <img src="photo2.jpg" alt="Photo 2">
        <img src="photo3.jpg" alt="Photo 3">
        <img src="photo4.jpg" alt="Photo 4">
        <img src="photo5.jpg" alt="Photo 5">
        <img src="photo6.jpg" alt="Photo 6">
        <img src="photo7.jpg" alt="Photo 7">
        <img src="photo8.jpg" alt="Photo 8">
        <img src="photo9.jpg" alt="Photo 9">
        <img src="photo10.jpg" alt="Photo 10">
        <img src="photo11.jpg" alt="Photo 11">
        <img src="photo12.jpg" alt="Photo 12">
        <img src="photo13.jpg" alt="Photo 13">

    </div>

</body>

</html>
